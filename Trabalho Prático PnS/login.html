<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Estufa - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>🌿 Smart Estufa</h2>
            <p>Insira as suas credenciais para aceder ao sistema</p>
            
            <div id="mensagem-erro" class="alert error" style="display: none;"></div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="exemplo@estufa.com">
                </div>

                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" id="btn-login">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
